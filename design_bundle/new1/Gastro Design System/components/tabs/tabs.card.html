<!-- @dsCard group="Components" viewport="700x640" name="Tabs" subtitle="Big · Small · Extra Small · Line Tabs · Menu Tabs · Menu Tabs Vertical" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-family-base); background: var(--color-bg-canvas); color: var(--color-text-primary); }
  .stack { display: flex; flex-direction: column; gap: 24px; max-width: 420px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--color-text-tertiary); margin: 0 0 10px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { TabBar, MenuCategoryTabs, MenuTabs, MenuTabsVertical } = window.GastroDesignSystem_472aed;
    const p1 = 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=96&q=80';
    const p2 = 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=96&q=80';
    const p3 = 'https://images.unsplash.com/photo-1551024506-0bccd828d307?w=96&q=80';
    function Demo() {
      const [view, setView] = React.useState('delivery');
      const [cat, setCat] = React.useState('Mains');
      const [menu, setMenu] = React.useState('pizza');
      return (
        <div className="stack">
          <div>
            <p className="eyebrow">Big</p>
            <TabBar value={view} onChange={setView}
              options={[{label:'Delivery',value:'delivery',icon:'motorcycle'},{label:'Pickup',value:'pickup',icon:'storefront'}]} />
          </div>
          <div>
            <p className="eyebrow">Small</p>
            <TabBar size="small" value={view} onChange={setView}
              options={[{label:'Delivery',value:'delivery',icon:'motorcycle'},{label:'Pickup',value:'pickup',icon:'storefront'}]} />
          </div>
          <div>
            <p className="eyebrow">Extra Small</p>
            <TabBar size="xs" value={view} onChange={setView}
              options={[{label:'Delivery',value:'delivery',icon:'motorcycle'},{label:'Pickup',value:'pickup',icon:'storefront'}]} />
          </div>
          <div>
            <p className="eyebrow">Line Tabs</p>
            <MenuCategoryTabs activeKey={cat} onChange={setCat} categories={['Starters','Mains','Desserts','Drinks']} />
          </div>
          <div>
            <p className="eyebrow">Menu Tabs</p>
            <MenuTabs value={menu} onChange={setMenu}
              categories={[{label:'Pizza',value:'pizza',image:p1},{label:'Burgers',value:'burgers',image:p2},{label:'Desserts',value:'desserts',image:p3}]} />
          </div>
          <div>
            <p className="eyebrow">Menu Tabs Vertical</p>
            <MenuTabsVertical value={menu} onChange={setMenu}
              categories={[{label:'Pizza',value:'pizza',image:p1},{label:'Burgers',value:'burgers',image:p2},{label:'Desserts',value:'desserts',image:p3}]} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
