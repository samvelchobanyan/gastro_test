<!-- @dsCard group="Components" viewport="700x220" name="Filter" subtitle="Round icon-over-label · FilterBar horizontal alternative" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-family-base); background: var(--color-bg-canvas); color: var(--color-text-primary); }
  .row { display: flex; gap: 20px; align-items: center; }
  .row2 { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--color-text-tertiary); margin: 0 0 10px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Filter, FilterBar } = window.GastroDesignSystem_472aed;
    function Demo() {
      const [cuisine, setCuisine] = React.useState('it');
      const [cuisine2, setCuisine2] = React.useState('su');
      return (
        <div>
          <p className="eyebrow">Filter</p>
          <div className="row">
            <Filter label="Italian" icon="fork-knife" selected={cuisine==='it'} onClick={()=>setCuisine('it')} />
            <Filter label="Sushi" icon="fish" selected={cuisine==='su'} onClick={()=>setCuisine('su')} />
            <Filter label="Vegan" icon="leaf" selected={cuisine==='ve'} onClick={()=>setCuisine('ve')} />
          </div>
          <p className="eyebrow" style={{marginTop:20}}>FilterBar</p>
          <div className="row2">
            <FilterBar label="Italian" icon="fork-knife" selected={cuisine2==='it'} onClick={()=>setCuisine2('it')} />
            <FilterBar label="Sushi" icon="fish" selected={cuisine2==='su'} onClick={()=>setCuisine2('su')} />
            <FilterBar label="Vegan" icon="leaf" selected={cuisine2==='ve'} onClick={()=>setCuisine2('ve')} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
