<!-- @dsCard group="Foundations" viewport="700x460" name="Overlays" subtitle="BottomSheet · Dialog · Toast (tap to open)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-family-base); background: var(--color-bg-canvas); color: var(--color-text-primary); }
  .frame { position: relative; width: 320px; height: 400px; background: var(--color-bg-main); border: 1px solid var(--color-border-default); border-radius: 20px; overflow: hidden; }
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .lay { display: flex; gap: 28px; align-items: flex-start; }
  .btn { height: 44px; padding: 0 16px; border: 1px solid var(--color-border-default); background: var(--color-bg-main); border-radius: 10px; font-family: var(--font-family-base); font-weight: 600; font-size: 14px; cursor: pointer; }
  .filler { padding: 20px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { BottomSheet, Dialog, Toast, Button } = window.GastroDesignSystem_472aed;
    function Demo() {
      const [sheet, setSheet] = React.useState(false);
      const [dialog, setDialog] = React.useState(false);
      const [toast, setToast] = React.useState(true);
      return (
        <div className="lay">
          <div className="controls">
            <button className="btn" onClick={()=>setSheet(true)}>Open bottom sheet</button>
            <button className="btn" onClick={()=>setDialog(true)}>Open dialog</button>
            <button className="btn" onClick={()=>setToast(t=>!t)}>Toggle toast</button>
          </div>
          <div className="frame">
            <div className="filler">
              <p style={{color:'var(--color-text-tertiary)',fontSize:13,margin:0}}>Screen frame — overlays render here.</p>
            </div>
            <Toast open={toast} tone="success" message="Added to cart" actionLabel="Undo" onAction={()=>setToast(false)} />
            <BottomSheet open={sheet} onClose={()=>setSheet(false)} title="Customize"
              footer={<Button fullWidth onClick={()=>setSheet(false)}>Add to cart · $14.00</Button>}>
              <p style={{color:'var(--color-text-secondary)',fontSize:14}}>Choose size, add-ons and special instructions before adding to the cart.</p>
            </BottomSheet>
            <Dialog open={dialog} onClose={()=>setDialog(false)} icon="trash" tone="destructive"
              title="Remove item?" description="This removes it from your cart."
              confirmLabel="Remove" onConfirm={()=>setDialog(false)} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
