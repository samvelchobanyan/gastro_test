<!-- @dsCard group="Components" viewport="700x520" name="Date and Time" subtitle="Calendar (date + time) · DatePicker · TimePicker" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-family-base); background: var(--color-bg-canvas); color: var(--color-text-primary); }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: start; }
  .grid > div { min-width: 0; }
  .stack { display: flex; flex-direction: column; gap: 22px; max-width: 380px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--color-text-tertiary); margin: 0 0 10px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Calendar, DatePicker, TimePicker } = window.GastroDesignSystem_472aed;
    function Demo() {
      const [when, setWhen] = React.useState({ date: null, time: '19:00' });
      const [date, setDate] = React.useState(null);
      const [time, setTime] = React.useState('19:00');
      return (
        <div className="grid">
          <div>
            <p className="eyebrow">Calendar (date + time)</p>
            <Calendar value={when} onChange={setWhen}
              timeSlots={['18:00','18:30','19:00','19:30',{time:'20:00',disabled:true},'20:30']} />
          </div>
          <div className="stack">
            <div>
              <p className="eyebrow">DatePicker</p>
              <DatePicker value={date} onChange={setDate} label="Date" />
            </div>
            <div>
              <p className="eyebrow">TimePicker</p>
              <TimePicker value={time} onChange={setTime} label="Time"
                slots={['18:00','18:30','19:00','19:30',{time:'20:00',disabled:true},'20:30']} />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
