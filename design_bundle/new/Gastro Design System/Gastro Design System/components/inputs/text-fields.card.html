<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-family-base); background: var(--color-bg-canvas); color: var(--color-text-primary); }
  .col { display: flex; flex-direction: column; gap: 18px; max-width: 340px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { TextInput, TextArea } = window.GastroDesignSystem_472aed;
    function Demo() {
      const [a, setA] = React.useState('Alicia Wong');
      const [b, setB] = React.useState('');
      const [notes, setNotes] = React.useState('No onions, extra napkins.');
      return (
        <div className="col">
          <TextInput label="Full name" value={a} onChange={setA} iconLeft="user" />
          <TextInput label="Email" value={b} onChange={setB} placeholder="you@email.com" type="email"
            error helperText="Enter a valid email address" iconLeft="envelope" />
          <TextArea label="Special instructions" value={notes} onChange={setNotes} maxLength={200} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
