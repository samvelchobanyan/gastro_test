<!-- @dsCard group="Organisms" viewport="700x460" name="Restaurant" subtitle="RestaurantHeader · RestaurantCard · Address · ETA" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-family-base); background: var(--color-bg-canvas); color: var(--color-text-primary); }
  .stack { display: flex; flex-direction: column; gap: 18px; max-width: 620px; }
  .row { display: flex; gap: 20px; align-items: center; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--color-text-tertiary); margin: 0 0 10px; }
  .cards { display: flex; gap: 16px; }
  .cardw { width: 220px; }
  .frame { border: 1px solid var(--color-border-default); border-radius: 16px; overflow: hidden; background: var(--color-bg-main); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { RestaurantHeader, RestaurantCard, AddressSelector, DeliveryTimeEstimate } = window.GastroDesignSystem_472aed;
    function Demo() {
      return (
        <div className="stack">
          <div className="frame">
            <RestaurantHeader name="Nolana Pizzeria" description="Wood-fired Neapolitan pizza, made fresh daily" rating={4.6} reviewCount={128} isOpen onBack={()=>{}} />
          </div>
          <AddressSelector address="12 Almond St, Apt 4" onClick={()=>{}} />
          <div className="row">
            <DeliveryTimeEstimate estimate="25–35 min" />
          </div>
          <div>
            <p className="eyebrow">Restaurant cards</p>
            <div className="cards">
              <div className="cardw"><RestaurantCard name="Nolana Pizzeria" cuisine="Italian · Pizza" rating={4.6} reviewCount={128} deliveryTime="25–35 min" deliveryFee={0} promoLabel="20% off" onClick={()=>{}} /></div>
              <div className="cardw"><RestaurantCard name="Sakura Sushi" cuisine="Japanese" rating={4.8} reviewCount={302} deliveryTime="30–40 min" deliveryFee={2.5} onClick={()=>{}} /></div>
              <div className="cardw"><RestaurantCard name="Green Bowl" cuisine="Vegan · Salads" rating={4.3} reviewCount={54} deliveryTime="20–30 min" closed onClick={()=>{}} /></div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
