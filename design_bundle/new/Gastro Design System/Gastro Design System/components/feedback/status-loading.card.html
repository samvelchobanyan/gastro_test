<!-- @dsCard group="Organisms" viewport="700x440" name="Status & loading" subtitle="ProgressBar · Spinner · Skeleton · Empty · Error" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-family-base); background: var(--color-bg-canvas); color: var(--color-text-primary); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--color-text-tertiary); margin: 0 0 12px; }
  .surface { background: var(--color-bg-main); border: 1px solid var(--color-border-muted); border-radius: 12px; padding: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { ProgressBar, Spinner, Skeleton, EmptyState, ErrorState } = window.GastroDesignSystem_472aed;
    function Demo() {
      return (
        <div className="grid">
          <div>
            <p className="eyebrow">Progress · Spinner</p>
            <div className="surface" style={{display:'flex',flexDirection:'column',gap:16}}>
              <ProgressBar value={70} label="Uploading" showValue />
              <ProgressBar indeterminate />
              <div style={{display:'flex',gap:16,alignItems:'center'}}><Spinner size={28} /><Spinner size={20} /></div>
            </div>
            <p className="eyebrow" style={{marginTop:20}}>Skeleton</p>
            <div className="surface" style={{display:'flex',gap:12}}>
              <Skeleton variant="circle" width={44} />
              <Skeleton variant="text" lines={3} />
            </div>
          </div>
          <div>
            <p className="eyebrow">Empty · Error</p>
            <div className="surface" style={{padding:0,overflow:'hidden'}}>
              <EmptyState icon="shopping-cart-simple" title="Cart is empty" description="Add dishes to get started." actionLabel="Browse menu" />
            </div>
            <div className="surface" style={{padding:0,overflow:'hidden',marginTop:16}}>
              <ErrorState />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
