<!-- @dsCard group="Organisms" viewport="700x460" name="Order tracking & history" subtitle="OrderStatusTimeline · LiveOrderTrackingMap · OrderHistoryCard · Reorder · Rating" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-family-base); background: var(--color-bg-canvas); color: var(--color-text-primary); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .grid > div { min-width: 0; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--color-text-tertiary); margin: 0 0 10px; }
  .surface { background: var(--color-bg-main); border: 1px solid var(--color-border-muted); border-radius: 12px; padding: 16px; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { OrderStatusTimeline, LiveOrderTrackingMap, OrderHistoryCard, ReorderButton, RatingReviewPrompt } = window.GastroDesignSystem_472aed;
    function Demo() {
      const [rating, setRating] = React.useState(0);
      return (
        <div className="grid">
          <div className="stack">
            <div>
              <p className="eyebrow">Live tracking</p>
              <LiveOrderTrackingMap eta="12 min" height={140} />
            </div>
            <div className="surface">
              <OrderStatusTimeline currentIndex={2} steps={[
                {label:'Order placed', time:'6:02 PM', icon:'receipt'},
                {label:'Preparing', time:'6:05 PM', icon:'cooking-pot'},
                {label:'Out for delivery', icon:'motorcycle'},
                {label:'Delivered', icon:'check-circle'},
              ]} />
            </div>
          </div>
          <div className="stack">
            <div>
              <p className="eyebrow">Order history</p>
              <OrderHistoryCard restaurantName="Nolana Pizzeria" date="Jun 12, 6:02 PM"
                itemsSummary="Margherita Pizza, Caesar Salad +1 more" total={34.5}
                actions={<ReorderButton onClick={()=>{}} />} />
            </div>
            <div>
              <p className="eyebrow">Rating prompt</p>
              <RatingReviewPrompt restaurantName="Nolana Pizzeria" rating={rating} onRatingChange={setRating} />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
