<!-- @dsCard group="Foundations" viewport="700x150" name="Neutral ramp" subtitle="Global gray primitives — the 60% + 30% of the palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-family-base); background: var(--color-bg-main); }
  .ramp { display: flex; gap: 4px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-sm); border: 1px solid var(--color-border-muted); }
  .lbl { margin-top: 6px; font-size: 11px; line-height: 14px; color: var(--color-text-tertiary); font-weight: var(--font-weight-semibold); }
  .hex { font-size: 10px; line-height: 14px; color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw"><div class="chip" style="background:var(--gray-0)"></div><div class="lbl">0</div><div class="hex">FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-50)"></div><div class="lbl">50</div><div class="hex">F7F7F7</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-100)"></div><div class="lbl">100</div><div class="hex">F1F1F1</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-200)"></div><div class="lbl">200</div><div class="hex">EAEAEA</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-300)"></div><div class="lbl">300</div><div class="hex">E0E0E0</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-400)"></div><div class="lbl">400</div><div class="hex">D1D1D1</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-500)"></div><div class="lbl">500</div><div class="hex">B3B3B3</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-600)"></div><div class="lbl">600</div><div class="hex">8C8C8C</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-700)"></div><div class="lbl">700</div><div class="hex">4F4F4F</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-800)"></div><div class="lbl">800</div><div class="hex">383838</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-900)"></div><div class="lbl">900</div><div class="hex">232323</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-1000)"></div><div class="lbl">1000</div><div class="hex">000000</div></div>
  </div>
</body>
</html>
