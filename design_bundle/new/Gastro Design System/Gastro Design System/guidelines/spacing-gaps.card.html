<!-- @dsCard group="Foundations" viewport="700x180" name="Stacking gaps" subtitle="8px between text · 16px between blocks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-family-base); background: var(--color-bg-canvas); color: var(--color-text-primary); display: flex; gap: 40px; }
  .demo { width: 260px; background: var(--color-bg-surface); border: 1px solid var(--color-border-muted); border-radius: var(--radius-md); padding: 16px; box-sizing: border-box; }
  .title { font-size: 16px; line-height: 24px; font-weight: var(--font-weight-semibold); }
  .desc { font-size: 13px; line-height: 18px; color: var(--color-text-secondary); }
  .gap8 { margin-top: 8px; }
  .gap16 { margin-top: 16px; }
  .imgblock { height: 40px; border-radius: var(--radius-sm); background: var(--color-bg-surface-sunken); }
  .tag { display: inline-block; margin-top: 10px; font-size: 11px; color: var(--color-text-tertiary); font-weight: var(--font-weight-semibold); }
</style>
</head>
<body>
  <div>
    <div class="demo">
      <div class="title">Margherita</div>
      <div class="desc gap8">Headline and description sit 8px apart.</div>
    </div>
    <span class="tag">gap-text · 8px</span>
  </div>
  <div>
    <div class="demo">
      <div class="title">Margherita</div>
      <div class="imgblock gap16"></div>
    </div>
    <span class="tag">gap-block · 16px</span>
  </div>
</body>
</html>
