<!-- @dsCard group="Foundations" viewport="700x210" name="Mobile layout grid" subtitle="360px · 16px margins · 8px gutter · 4 columns" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-family-base); background: var(--color-bg-canvas); color: var(--color-text-primary); }
  .phone { width: 360px; margin: 0 auto; background: var(--color-bg-main); border: 1px solid var(--color-border-default); border-radius: var(--radius-md); padding: 0 16px; box-sizing: border-box; }
  .opt { display: flex; gap: 8px; padding: 8px 0; }
  .col { height: 26px; background: var(--color-brand-subtle); border: 1px solid var(--accent-200); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--color-text-accent); font-weight: var(--font-weight-semibold); }
  .cap { text-align: center; font-size: 11px; line-height: 15px; color: var(--color-text-tertiary); margin-top: 8px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="opt"><span class="col" style="width:76px">76</span><span class="col" style="width:76px">76</span><span class="col" style="width:76px">76</span><span class="col" style="width:76px">76</span></div>
    <div class="opt"><span class="col" style="width:160px">160</span><span class="col" style="width:160px">160</span></div>
    <div class="opt"><span class="col" style="width:76px">76</span><span class="col" style="width:244px">244</span></div>
    <div class="opt"><span class="col" style="width:328px">328 · full width</span></div>
  </div>
  <div class="cap">Rearranging or resizing blocks must never break the layout.</div>
</body>
</html>
