<!-- @dsCard group="Foundations" viewport="700x150" name="Weights" subtitle="Plus Jakarta Sans — 400 / 500 / 600 / 700" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-family-base); background: var(--color-bg-main); color: var(--color-text-primary); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .cell { }
  .sample { font-size: 34px; line-height: 40px; letter-spacing: var(--letter-spacing-tight); }
  .lbl { margin-top: 6px; font-size: 12px; line-height: 16px; color: var(--color-text-secondary); font-weight: var(--font-weight-semibold); }
  .tok { font-size: 11px; line-height: 15px; color: var(--color-text-tertiary); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="sample" style="font-weight:400">Aa</div><div class="lbl">Regular</div><div class="tok">400</div></div>
    <div class="cell"><div class="sample" style="font-weight:500">Aa</div><div class="lbl">Medium</div><div class="tok">500</div></div>
    <div class="cell"><div class="sample" style="font-weight:600">Aa</div><div class="lbl">SemiBold</div><div class="tok">600</div></div>
    <div class="cell"><div class="sample" style="font-weight:700">Aa</div><div class="lbl">Bold</div><div class="tok">700</div></div>
  </div>
</body>
</html>
